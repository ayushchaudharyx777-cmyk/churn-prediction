name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (trains a model on synthetic data, tests API + drift + policy maths)
        run: pytest -q
      - name: Validate Kubernetes manifests against the API schema
        run: |
          pip install kubernetes-validate
          kubernetes-validate -k 1.34 --strict $(ls k8s/*.yaml | grep -v kustomization)
      - name: Airflow DAG compiles
        run: python -m py_compile airflow/dags/churn_pipeline.py
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-api:ci .
