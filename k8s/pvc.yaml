# Shared log volume (prediction + label logs). ReadWriteOnce is fine for kind/minikube (single node);
# a multi-node production cluster would use RWX storage or ship logs to a queue/DB instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: churn-logs
  namespace: churn
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
